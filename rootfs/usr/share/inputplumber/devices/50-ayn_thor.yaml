# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: AYN Thor
single_source: false

options:
  auto_manage: true

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: ayn,thor

source_devices:
  - group: gamepad
    capability_map_id: ayn2
    evdev:
      name: AYN Odin2 Gamepad
      phys_path: rsinput-gamepad/input0
      handler: event*
      vendor_id: "2020"
      product_id: "3001"

  - group: gamepad
    capability_map_id: ayn2
    evdev:
      name: gpio-keys-ayn
      phys_path: gpio-keys/input0
      handler: event*

  - group: imu
    fastrpc:
      name: fastrpc-adsp
      id: /sys/devices/virtual/misc/fastrpc-adsp
    config:
      imu:
        # Post-libssc frame; physical mounting is not independently verified.
        mount_matrix:
          x: [1.0, 0.0, 0.0]
          y: [0.0, 1.0, 0.0]
          z: [0.0, 0.0, 1.0]

target_devices:
  - xbox-elite
